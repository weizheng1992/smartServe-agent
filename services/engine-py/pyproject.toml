[project]
name = "engine-py"
version = "0.1.0"
description = "Agent 决策引擎的 Python 重写(Phase 1 影子替换 packages/engine)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "sentence-transformers>=5.2",
    "langchain-huggingface>=1.2",
]

[project.optional-dependencies]
# Temporal worker(影子期独立 task queue agent-tasks-py)
worker = ["temporalio>=1.4"]

[dependency-groups]
# outbox 对账等 DB 语义测试经 testcontainers 起 PG(镜像 gateway-py 密封测试模式;Docker 不可用时自动 skip)
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=1.0", "testcontainers[postgres]>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# 2026-09-05 存量豁免(CI 门禁立起前的显式还债清单,新代码同样适用,修复后逐条移除):
# - DTZ005/DTZ011:datetime.now()/date.today() 补 tz 属时间语义变更,影响落库时间戳,须逐处评审
# - RUF012:skills/registry 可变类默认在运行时被实例级覆写,加 ClassVar 反而破坏契约
# - S110/BLE001:吞错点须补结构化日志后才能消除(观测性红线,禁止直接删 except)
ignore = [
  "DTZ005",
  "DTZ011",
  "RUF012",
  "S110",
  "BLE001",
  "ASYNC230",
  "SIM102",
  "SIM103",
]
