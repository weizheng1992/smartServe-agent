[project]
name = "engine-py"
version = "0.1.0"
description = "Agent 决策引擎的 Python 重写(Phase 1 影子替换 packages/engine)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# Temporal worker(影子期独立 task queue agent-tasks-py)
worker = ["temporalio>=1.4"]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_py"]

[tool.ruff]
line-length = 110
target-version = "py312"
