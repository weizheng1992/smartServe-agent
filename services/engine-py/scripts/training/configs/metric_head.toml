# 指标映射分类头(推荐首训;labels = metric_registry 闭集 + unsupported 兜底)
# 训练时复制为 metric_head.toml 修改;所有路径相对 services/engine-py。

[task]
name = "metric_head"
input_field = "query"
label_field = "label"
# 与 metric_registry 登记指标保持同源(新指标登记时同步改这里)
# 与 METRIC_SEMANTIC_REGISTRY 同源(2026-10-02 重对齐 38 闭集;order_overview
# 实体概览除外);同源契约由 tests/test_metric_registry.py 钉死,漂移即红。
labels = [
  "gmv", "volume", "gross_profit", "margin_rate",
  "stock_risk", "review_bad", "refund_rate", "session_volume",
  "promo_orders", "promo_discount_total", "promo_gmv_total", "gmv_trend",
  "volume_trend", "after_sale_overview", "ai_resolution_rate", "promo_effect",
  "promo_sku_compare", "promo_compare", "customer_orders", "aov",
  "order_count", "review_good", "zero_sales", "category_gmv_top",
  "customer_spend_top", "customer_spend_stats", "customer_coupons", "customer_profile",
  "customer_panorama", "biz_overview", "gmv_mom", "orders_trend",
  "stock_value", "customer_spend_trend", "attribution_refund", "attribution_sales",
  "spu_compare",
  "unsupported",   # 闭集外 → 放行 L3 LLM 兜底,不许静默错分
]

[data]
# 原料:prelabel 产物或人工标注 JSONL(query + label)
train_jsonl = "training_data/metric_head/seed.jsonl"
out_dir = "training_data/metric_head/processed"
heldout_ratio = 0.15
# 评测句泄漏防护:blocklist = promptfoo 评测用例的问句(11-D3 cos>=0.90 挡)
eval_blocklist_jsonl = "../../eval/testCases/data_analytics/mapping.json"
blocklist_field = "vars.input"
near_dup_threshold = 0.90

[model]
# 真跑用 bge(与线上判重缓存同底座);"hash" = 冒烟/CI(不下载模型,仅验流水线)
encoder = "BAAI/bge-small-zh-v1.5"
device = "cpu"

[train]
epochs = 20
batch_size = 32
lr = 0.01
seed = 42

[output]
# 产物 = 未来指标映射 adapter 的载荷(head.pt / labels.json / config.snapshot.toml / metrics.json)
run_dir = "training_runs/metric_head"
