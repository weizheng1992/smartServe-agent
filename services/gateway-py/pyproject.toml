[project]
name = "gateway-py"
version = "0.1.0"
description = "NestJS API 网关的 Python 参考重写(Phase 2,39 路由 1:1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "engine-py",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.32",
    # 路由与 repo 直接 import(非经 engine-py 透传),须显式声明
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    # python-socketio AsyncClient 的 websocket 传输依赖 aiohttp(契约测试 transports=["websocket"])
    "aiohttp>=3.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_py"]

[tool.uv.sources]
engine-py = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# 2026-09-05 存量豁免(CI 门禁立起前的显式还债清单,修复后逐条移除):
# - DTZ005/DTZ011:datetime.now()/date.today() 补 tz 属时间语义变更,影响落库时间戳,须逐处评审
# - S110/BLE001:吞错点须补结构化日志后才能消除(观测性红线,禁止直接删 except)
# - TRY004:sandbox 安全拒绝用 ValueError 与上层捕获/契约测试钉死的异常类型耦合,不可单点换 TypeError
ignore = [
  "DTZ005",
  "DTZ011",
  "S110",
  "BLE001",
  "TRY004",
  "SIM102",
]

# FastAPI 依赖注入标记是声明式默认值而非可变默认(B008 误报):
# Depends/File 进 DI 白名单,免逐处 noqa(chat.py upload 的既有 noqa 先例止增)
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
