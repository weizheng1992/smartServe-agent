[project]
name = "gateway-py"
version = "0.1.0"
description = "NestJS API 网关的 Python 参考重写(Phase 2,39 路由 1:1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "engine-py",
    "sqlglot>=25.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    # python-socketio AsyncClient 的 websocket 传输依赖 aiohttp(契约测试 transports=["websocket"])
    "aiohttp>=3.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_py"]

[tool.uv.sources]
engine-py = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
