description: "智能客服平台: 意图分类、任务规划、槽位反问与端到端回答质量 全量统一评测大盘"

prompts:
  - "{{input}}"

providers:
  - "file://providers/agent_provider.py:call_api"

defaultTest:
  options:
    provider: "file://providers/agent_provider.py:call_api"
    # 数组 vars 律(2026-10-23):promptfoo generateVarCombinations 会把数组值 vars
    # 逐元素笛卡尔裂行 —— expectedTools:[a,b] 裂成两行、每行只断言半个期望集
    # (断言强度被静默腰斩;58 行旧基线即此产物)。期望集必须整队断言,一律关展开。
    disableVarExpansion: true

# 串行 + 行间隔:真跑 triage/RAG/judge 的行背靠背调用会撞 bigmodel RPM 限制,
# 429 把咨询直答打成 consult_no_rag 回退、judge 打成 scorer 报错(限流噪声
# 污染基线);maxConcurrency=1 显式钉串行(0.111 默认即 1),行间延迟见
# baselineLib.ts 的 --delay 3000
evaluateOptions:
  maxConcurrency: 1

tests:
  - testCases/ecommerce/single-intent.json
  - testCases/ecommerce/multi-intent.json
  - testCases/ecommerce/order-query.json
  - testCases/ecommerce/logistics.json
  - testCases/ecommerce/refund-return.json
  - testCases/ecommerce/modify-address.json
  - testCases/ecommerce/cancel-order.json
  - testCases/ecommerce/slot-clarification.json
  - testCases/ecommerce/multimodal-damage.json
  - testCases/ecommerce/metric-disambiguation.json
  - testCases/ecommerce/consult-fastpath.json
  - testCases/ecommerce/cart-guide.json
  - testCases/ecommerce/arbitration-consistency.json
  - testCases/ecommerce/baseline-incidents.json
  - testCases/legal/single-intent.json
  - testCases/security/injection.json
  - testCases/ecommerce/rag-evaluation.json
  - testCases/ecommerce/multi-tenant.json
