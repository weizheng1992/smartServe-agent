# 生产编排:四前端(nginx 一体) + gateway + migrate + Redis
# PG 已剥离(2026-10-20):统一复用同机 adkg 的 PG18 实例(容器 adkg-postgres,pgvector 镜像),
# 经共享 docker 网络 shared-infra 按容器名直连(见文件尾 networks)。启动顺序:
#   ① docker network create shared-infra   ② ad-kg 仓库 docker compose up -d(内含一次性
#   bash scripts/init_external_pg.sh 建两库一角色)   ③ 本编排 up
# 用法见 docs/deploy.md;Redis 与本地开发共用仓库根 docker-compose.yml,两者不冲突

name: smartserve-prod

networks:
  shared-infra:
    external: true

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-redis_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # ports: ["6379:6379"]

  # 一次性:alembic 迁移,gateway 等它成功后才启动
  # image 与 gateway 同镜像(alembic 命令覆盖)——不写 image 则 compose 会在部署机本地
  # build(弱机必炸,B 机实测);传输走 CI 部署步的南大代理预拉 + retag(见 ci.yml)
  migrate:
    image: ghcr.io/weizheng1992/smartserve-gateway:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    networks:
      - default
      - shared-infra
    working_dir: /app/services/engine-py
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  gateway:
    # CI push main 自动推 GHCR(build-push job);build 段保留作本地兜底
    image: ghcr.io/weizheng1992/smartserve-gateway:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    networks:
      - default
      - shared-infra
    ports:
      - "4000:4000"
    environment:
      # fastembed ONNX 权重缓存指向挂载卷(chat.py 读此 env;缺省 tempdir 随容器蒸发)
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - uploads:/data/uploads          # UPLOADS_DIR 指到这里,聊天附件持久化
      - hf_cache:/root/.cache/fastembed  # fastembed ONNX 权重缓存(FASTEMBED_CACHE_PATH),重启免下载
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s   # 首启需下载 bge 本地 embedding 模型(卷缓存后重启秒过)
    restart: unless-stopped

  web:
    image: ghcr.io/weizheng1992/smartserve-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3005:3005"
      - "3006:3006"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  uploads:
  hf_cache:
