# 四前端 + /api 反代 gateway(同源,免 CORS)
# 3000=web  3001=admin  3005=merchant  3006=merchant-admin
# SSE(/api/chat/*/stream)与 socket.io 按长连接调优:关缓冲 + 1h 读超时 + upgrade 头。
# socket.io 客户端走顶层 /socket.io/ 路径(socket.io-client path 约定),不在
# /api/ 下 —— 3006(坐席台,唯一 socket.io 消费方,契约 test_deploy_nginx_contract.py)
# 专设 /socket.io/ 反代块;其余三端零 socket 客户端(server-gateway.md §1.2),
# 缺此块时握手落 SPA 回退,坐席永不上线(2026-10-23 线上认领失效实弹)。

# 访问日志双写(2026-10-22):stdout(docker logs,既有行为不变)之外,再落一份
# 到持久卷,供 goaccess 出访问报表(deploy/scripts/visits.sh)。格式 = combined
# 再补尾列 $server_port —— 四端(3000/3001/3005/3006)共用此日志,端口是唯一
# 可靠的端区分符($host 对 IP 直访会剥端口,不可用);visits.sh 的 goaccess
# spec 与此逐 token 对齐(尾列 %v 进 Vhosts 面板)。同上下文多条 access_log
# 并存是 nginx 语义,不是覆盖。
log_format analytics '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" $server_port';
access_log /data/logs/access.log analytics;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 用 Docker 内置 DNS 启动期不解析 upstream:gateway 重启换 IP 也不影响
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 3000;
    root /var/www/web;
    index index.html;
    location /healthz { return 200 'ok'; }
    location /api/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }
    location / { try_files $uri /index.html; }
}

server {
    listen 3001;
    root /var/www/admin;
    index index.html;
    location /healthz { return 200 'ok'; }
    # 访问分析报表(goaccess 静态快照,visits.sh --html 生成到持久卷)。
    # 基本认证防公开(含访客 IP 属敏感数据);dotfile 一律 404 —— .htpasswd
    # 就在同一卷里,绝不能被拉取。
    location /reports/ {
        alias /var/www/reports/;
        location ~ /\. { return 404; }
        auth_basic "smartserve analytics";
        auth_basic_user_file /var/www/reports/.htpasswd;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }
    location / { try_files $uri /index.html; }
}

server {
    listen 3005;
    root /var/www/merchant;
    index index.html;
    location /healthz { return 200 'ok'; }
    location /api/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }
    location / { try_files $uri /index.html; }
}

server {
    listen 3006;
    root /var/www/merchant-admin;
    index index.html;
    location /healthz { return 200 'ok'; }
    # 坐席台 socket.io(2026-10-23 线上认领失效收口):客户端仅 websocket 传输
    # (无轮询兜底),升级头缺一不可;长连接调优与 /api/ 同款。
    location /socket.io/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }
    location / { try_files $uri /index.html; }
}
