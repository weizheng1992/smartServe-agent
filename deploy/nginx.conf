# 四前端 + /api 反代 gateway(同源,免 CORS)
# 3000=web  3001=admin  3005=merchant  3006=merchant-admin
# SSE(/api/chat/*/stream)与 socket.io 已按长连接调优:关缓冲 + 1h 读超时 + upgrade 头

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 用 Docker 内置 DNS 启动期不解析 upstream:gateway 重启换 IP 也不影响
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 3000;
    root /var/www/web;
    index index.html;
    location /healthz { return 200 'ok'; }
    location /api/ {
        set $gateway_upstream http://gateway:4000;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }
    location / { try_files $uri /index.html; }
}

