# 商户面生产编排:merchant(3005) + merchant-admin(3006) 两面前端 + gateway + migrate + Redis
# 只裁前端构建与端口暴露;网关/引擎/数据库与全量部署(Dockerfile.web 四端)同一套,
# web/admin 专属路由在网关闲置无害。用法见 docs/deploy.md「场景 B」。
# 注:project name 与全量版不同 → 卷按 smartserve-merchant_* 命名,两套编排数据互不串。
# 注:PG 已剥离(2026-10-20),与 docker-compose.prod.yml 同批同构改版:redis/migrate/gateway
# 三 service 逐字同构,改版须两文件同批;外部 PG 为同机 adkg PG18(见 prod.yml 头注)。
name: smartserve-merchant

# 日志轮转(2026-10-21):与 prod.yml 同批同构,json-file 3×10m 封顶防小盘吃满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  shared-infra:
    external: true

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-redis_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
    # ports: ["6379:6379"]

  # 一次性:alembic 迁移,gateway 等它成功后才启动
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    networks:
      - default
      - shared-infra
    working_dir: /app/services/engine-py
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  gateway:
    # 与 prod.yml 同批同构:CI 推 GHCR;merchant-web 镜像不入流水线(主拓扑用 prod 版 web)
    image: ghcr.io/weizheng1992/smartserve-gateway:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    networks:
      - default
      - shared-infra
    ports:
      - "4000:4000"
    environment:
      # fastembed ONNX 权重缓存指向挂载卷(chat.py 读此 env;缺省 tempdir 随容器蒸发)
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - uploads:/data/uploads          # UPLOADS_DIR 指到这里,聊天附件持久化
      - hf_cache:/root/.cache/fastembed  # fastembed ONNX 权重缓存(FASTEMBED_CACHE_PATH),重启免下载
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s   # 首启需下载 bge 本地 embedding 模型(卷缓存后重启秒过)
    logging: *default-logging
    restart: unless-stopped

  merchant-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web.merchant
    ports:
      - "3005:3005"
      - "3006:3006"
    depends_on:
      gateway:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

volumes:
  redis_data:
  uploads:
  hf_cache:
