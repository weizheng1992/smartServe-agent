# 商户面生产编排:merchant(3005) + merchant-admin(3006) 两面前端 + gateway + migrate + PG/Redis
# 只裁前端构建与端口暴露;网关/引擎/数据库与全量部署(Dockerfile.web 四端)同一套,
# web/admin 专属路由在网关闲置无害。用法见 docs/deploy.md「场景 B」。
# 注:project name 与全量版不同 → 卷按 smartserve-merchant_* 命名,两套编排数据互不串。
# 注:postgres/redis/migrate/gateway 四 service 与 docker-compose.prod.yml 逐字同构,改版须两文件同批。
name: smartserve-merchant

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 生产默认不向宿主机暴露 5432;需要外部 BI/psql 再放开注释
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-redis_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # ports: ["6379:6379"]

  # 一次性:alembic 迁移,gateway 等它成功后才启动
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    working_dir: /app/services/engine-py
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: .env.prod
    ports:
      - "4000:4000"
    environment:
      # fastembed ONNX 权重缓存指向挂载卷(chat.py 读此 env;缺省 tempdir 随容器蒸发)
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - uploads:/data/uploads          # UPLOADS_DIR 指到这里,聊天附件持久化
      - hf_cache:/root/.cache/fastembed  # fastembed ONNX 权重缓存(FASTEMBED_CACHE_PATH),重启免下载
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s   # 首启需下载 bge 本地 embedding 模型(卷缓存后重启秒过)
    restart: unless-stopped

  merchant-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web.merchant
    ports:
      - "3005:3005"
      - "3006:3006"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  uploads:
  hf_cache:
