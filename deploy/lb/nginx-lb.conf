# 场景 D:负载均衡器(自托管 nginx 版;云 SLB 则在控制台配后端组+健康检查,参数照抄)
# 放在一台入口机(或复用某前端机):TLS 终结 + upstream 轮询 N 台 gateway 节点
#
# upstream 列表:gateway 节点机 IP:4000,加节点/摘节点改这里后 reload
# 开源 nginx 仅被动健康检查(max_fails);主动探活用云 SLB 或加 nginx_plus/upstream_check 模块
#
# TLS 证书路径自行放置;无证书时先监听 80 裸跑(不推荐生产)
upstream smartserve_gateway {
    least_conn;
    server 10.0.1.11:4000 max_fails=3 fail_timeout=15s;
    server 10.0.1.12:4000 max_fails=3 fail_timeout=15s;
    # server 10.0.1.13:4000 max_fails=3 fail_timeout=15s;   # 扩容时追加
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.mall.example.com;            # 换成你的 API 域名

    ssl_certificate     /etc/nginx/certs/api.mall.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/api.mall.example.com.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://smartserve_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE(/api/chat/*/stream)与 socket.io 长连接调优
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name api.mall.example.com;
    return 301 https://$host$request_uri;
}
