apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: smartserve
type: Opaque
stringData:
  # ⚠️ 全部占位:apply 前替换;AUTH_JWT_SECRET 用 `openssl rand -hex 32`
  AI_BASE_URL: "https://your-llm-gateway.example.com/v1"
  AI_API_KEY: "change-me"
  AI_MODEL: "your-model-name"
  AI_EMBEDDING_PROVIDER: "openai"      # 场景 D+:embedding 走 LLM 网关聚合的 /embeddings(后端 TEI)
  POSTGRES_PASSWORD: "change-me-strong"
  DATABASE_URL: "postgres://agent_user:change-me-strong@your-rds.example.com:5432/agent_platform?sslmode=require"
  REDIS_PASSWORD: "change-me-strong"
  REDIS_URL: "redis://:change-me-strong@your-redis.example.com:6379"
  AUTH_JWT_SECRET: "change-me-to-openssl-rand-hex-32"
  LANGCHAIN_API_KEY: ""
