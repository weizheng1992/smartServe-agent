# 最小 CI(2026-09-05 立):前端 lint/单测/构建 + Python ruff/engine 单测/gateway 契约测试。
# 刻意不进 CI 的部分:
# - Playwright E2E:依赖全栈 dev 环境,保持人工/夜间触发
# - promptfoo 评测:调真实 LLM 产生费用,走 bun run test:prompt:* 人工触发
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 (biome / 单测 / 构建)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 1.3.14 解包 lucide-react(4000+ 小文件)会丢文件(装出 2728/4070 个图标),
          # web 渲染测试报 Cannot find module './icons/*.mjs';1.4.0 完整
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # biome 存量仍在还债(noArrayIndexKey warn 等),先可见不阻断;清零后去掉 continue-on-error
      - name: Biome lint 与格式检查
        run: bunx biome check .
        continue-on-error: true
      - name: 前端单测 (web + admin)
        run: bun run test:unit
      - name: 构建 (web / admin / merchant)
        run: bun run build

  python:
    name: Python (ruff / engine 单测 / gateway 契约)
    runs-on: ubuntu-latest
    env:
      # runner 在海外:HF 端点必须显式指回原站——引擎代码缺省 setdefault hf-mirror.com,
      # 美国 runner 拉北京镜像必败(fastembed 两源全挂 → embedding 用例连带超时,
      # 首跑实证 tests/test_merchant_admin_order_detail.py TimeoutError 而本地 3 passed)
      HF_ENDPOINT: https://huggingface.co
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 与本地开发 venv 保持同版本(services/.venv 为 3.14)
      - run: uv python install 3.14
        working-directory: services
      # --frozen:锁文件已入库,免索引元数据往返(tuna 对海外 runner 间歇超时,
      # run 39402051669 实证 uv sync exit2+timed out,同一步首跑却过);重试一次兜波动
      - run: uv sync --frozen --all-extras || { sleep 20; uv sync --frozen --all-extras; }
        working-directory: services
      - name: Ruff (engine-py)
        run: uv run ruff check .
        working-directory: services/engine-py
      - name: Ruff (gateway-py)
        run: uv run ruff check .
        working-directory: services/gateway-py
      # 本体知识层(ADR-0015):lint 同口径 + 声明→生成物再生成漂移门 + 一致性门
      # (三步均在仓库根跑;首版 ../../ontology 相对 services 解析到仓库外,实弹已修)
      - name: Ruff (ontology)
        run: uv run --project services/engine-py ruff check ontology
      - name: ontology 再生成漂移门 (regen + git diff --exit-code)
        run: |
          uv run --project services/engine-py python ontology/registry.py --write-all
          git diff --exit-code -- ontology services/engine-py/src/engine_py/ontology_generated.py
      - name: ontology 一致性门 (parity + 负例 + codegen/TS/docs 同步)
        run: uv run --project services/engine-py python -m pytest ontology/tests -q
        env:
          # 占位连接串:parity 册 import engine semantic_model 需 env 在位,零真实连接
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
      - name: engine-py 单元测试
        run: set -o pipefail && uv run pytest 2>&1 | tee /tmp/engine-pytest.log
        working-directory: services/engine-py
      # gateway 契约测试经 testcontainers 起 PG+Redis,runner 自带 Docker
      - name: gateway-py 契约测试 (testcontainers)
        run: set -o pipefail && uv run pytest 2>&1 | tee /tmp/gateway-pytest.log
        working-directory: services/gateway-py
      # 日志对未登录不可见;任一步失败时把失败行回显为 check-run 注记(匿名 API 可读)
      - name: 失败测试注记回显
        if: failure()
        run: |
          for log in /tmp/engine-pytest.log /tmp/gateway-pytest.log; do
            touch "$log"
            grep -E "^(FAILED|ERROR) " "$log" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -5 "$log" | while IFS= read -r line; do
              echo "::error::tail: $line"
            done
          done

  # ── 自动发布(2026-10-20,两机拓扑的 B 机)────────────────────────────────
  # push main 且前后端测试双绿后才跑;PR 只测不发布。
  # 构建在 runner(4C16G)——B 机(免费 2C4G)只 pull + up,不做任何构建。
  build-push:
    name: 构建镜像 → GHCR
    needs: [frontend, python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sha + latest 双 tag:回滚 = compose tag 指回上一个 sha 再 up -d
      - name: 构建并推送 gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartserve-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartserve-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: 构建并推送 web(四端一体 nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartserve-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartserve-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: 部署 B 机(pull + up + 健康断言)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/agent-all
          git pull --ff-only
          # 镜像传输走南大代理(国内直连 ghcr.io 拉 GB 级 layer 会断流,B 机实测两连挂),
          # 拉完 retag 回正规名,compose 文件保持 ghcr.io 原名不留镜像源歧义。
          # 新鲜度闸(2026-10-23 实弹收口):南大镜像对刚推送的镜像有同步延迟,拉到旧镜像
          # 不会报错——compose up 无变化、容器静默陈旧、健康断言打在旧 gateway 上照样绿
          # (10-21/10-22 两次推送均如此落地失败)。故先比 manifest 哈希(纯元数据,秒级),
          # 镜像源滞后才回落直连 ghcr(B 机已持久 docker login,直连可用但慢)。
          pull_image() {
            local img=$1
            local nj=ghcr.nju.edu.cn/weizheng1992/$img gh=ghcr.io/weizheng1992/$img
            local nj_raw gh_raw
            nj_raw=$(docker manifest inspect $nj:latest 2>/dev/null || true)
            gh_raw=$(docker manifest inspect $gh:latest 2>/dev/null || true)
            if [ -n "$nj_raw" ] && [ -n "$gh_raw" ] \
               && [ "$(echo "$nj_raw" | sha256sum)" = "$(echo "$gh_raw" | sha256sum)" ]; then
              docker pull $nj:latest
              docker tag $nj:latest $gh:latest
            else
              echo ":: 镜像源未同步($img),回落直连 ghcr.io"
              docker pull $gh:latest
            fi
          }
          pull_image smartserve-gateway
          pull_image smartserve-web
          docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d
          REMOTE
          rm -f ~/deploy_key
      - name: 健康断言(首启 bge 下载最长 3 分钟,轮询兜住)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              echo "gateway 健康 ✓"; exit 0
            fi
            sleep 10
          done
          echo "健康检查 5 分钟未过" >&2; exit 1
          REMOTE
          rm -f ~/deploy_key
