# 最小 CI(2026-09-05 立):前端 lint/单测/构建 + Python ruff/engine 单测/gateway 契约测试。
# 刻意不进 CI 的部分:
# - Playwright E2E:依赖全栈 dev 环境,保持人工/夜间触发
# - promptfoo 评测:调真实 LLM 产生费用,走 bun run test:prompt:* 人工触发
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 (biome / 单测 / 构建)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 1.3.14 解包 lucide-react(4000+ 小文件)会丢文件(装出 2728/4070 个图标),
          # web 渲染测试报 Cannot find module './icons/*.mjs';1.4.0 完整
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # biome 存量仍在还债(noArrayIndexKey warn 等),先可见不阻断;清零后去掉 continue-on-error
      - name: Biome lint 与格式检查
        run: bunx biome check .
        continue-on-error: true
      - name: 前端单测 (web + admin)
        run: bun run test:unit
      - name: 构建 (web / admin / merchant)
        run: bun run build

  python:
    name: Python (ruff / engine 单测 / gateway 契约)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 与本地开发 venv 保持同版本(services/.venv 为 3.14)
      - run: uv python install 3.14
        working-directory: services
      - run: uv sync --all-extras
        working-directory: services
      - name: Ruff (engine-py)
        run: uv run ruff check .
        working-directory: services/engine-py
      - name: Ruff (gateway-py)
        run: uv run ruff check .
        working-directory: services/gateway-py
      # 本体知识层(ADR-0015):lint 同口径 + 声明→生成物再生成漂移门 + 一致性门
      - name: Ruff (ontology)
        run: uv run --project engine-py ruff check ../../ontology
        working-directory: services
      - name: ontology 再生成漂移门 (regen + git diff --exit-code)
        run: |
          uv run --project engine-py python ../../ontology/registry.py --write-all
          git diff --exit-code -- ontology services/engine-py/src/engine_py/ontology_generated.py
        working-directory: services
      - name: ontology 一致性门 (parity + 负例 + codegen/TS/docs 同步)
        run: uv run --project engine-py python -m pytest ../../ontology/tests -q
        working-directory: services
        env:
          # 占位连接串:parity 册 import engine semantic_model 需 env 在位,零真实连接
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
      - name: engine-py 单元测试
        run: set -o pipefail && uv run pytest 2>&1 | tee /tmp/engine-pytest.log
        working-directory: services/engine-py
      # gateway 契约测试经 testcontainers 起 PG+Redis,runner 自带 Docker
      - name: gateway-py 契约测试 (testcontainers)
        run: set -o pipefail && uv run pytest 2>&1 | tee /tmp/gateway-pytest.log
        working-directory: services/gateway-py
      # 日志对未登录不可见;任一步失败时把失败行回显为 check-run 注记(匿名 API 可读)
      - name: 失败测试注记回显
        if: failure()
        run: |
          for log in /tmp/engine-pytest.log /tmp/gateway-pytest.log; do
            touch "$log"
            grep -E "^(FAILED|ERROR) " "$log" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -5 "$log" | while IFS= read -r line; do
              echo "::error::tail: $line"
            done
          done
