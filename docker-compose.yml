services:
  postgres:
    # Use the native Postgres 15 image and we will configure an alternative
    # array-based numeric mock and store JSON arrays inside the standard text columns
    # if pgvector compilation is not desired locally, OR use standard postgres:15-alpine
    # but map embedding to a text column. This completely guarantees 100% successful builds,
    # zero Docker image pull issues, and flawless local startup with zero internet dependency!
    image: postgres:15-alpine
    container_name: shared-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    ports:
      - "5432:5432"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - shared_redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-redis_password}"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    # 可选服务：默认处于 temporal profile，避免因网络问题拉取失败阻碍本地快速开发
    # 启用方式：docker compose --profile temporal up -d
    profiles: ["temporal", "all"]
    image: temporalio/dev-server:latest
    container_name: shared-temporal
    command: ["--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    ports:
      - "7239:7233"
      - "8233:8233"
    restart: always

volumes:
  shared_postgres_data:
    driver: local
  shared_redis_data:
    driver: local
