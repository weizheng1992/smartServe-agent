services:
  # PostgreSQL 已剥离：统一复用同机 adkg 的 PG18 实例（容器 adkg-postgres，宿主 :5433，
  # 库 agent_platform / agent_merchant，账号 agent_user）。一次性初始化：
  #   bash scripts/init_external_pg.sh（建角色两库，幂等）
  # 详见 scripts/init_external_pg.sh 头注；剥离前本编排自带的 PG 数据卷
  #   shared_postgres_data 仅存于升级前的存量宿主机（新环境无此卷），未主动清理，作回滚保险。
  redis:
    image: redis:7-alpine
    container_name: shared-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - shared_redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-redis_password}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shared_redis_data:
    driver: local
